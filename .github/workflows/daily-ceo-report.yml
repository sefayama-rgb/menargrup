name: MENAR Otomatik Yonetim Raporu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-ceo-report.yml'
      - 'automation/report.js'
      - 'automation/weekly_report.js'
      - 'automation/weekly_html.js'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: menar-automatic-report
  cancel-in-progress: true

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bitrix ve Meta anlik raporunu uret
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
        run: node automation/report.js

      - name: Haftalik KPI ve gorev raporlarini uret
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
        run: node automation/weekly_report.js

      - name: Excel web veri tablolarini uret
        run: node automation/weekly_html.js

      - name: Raporlari depoya kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "menar-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            data/latest.json \
            data/weekly_kpi.json \
            data/weekly_kpi.csv \
            data/tasks_latest.json \
            data/tasks_latest.csv \
            data/weekly_kpi_table.html \
            data/tasks_latest_table.html

          if git diff --cached --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi

          git commit -m "Otomatik yonetim raporlarini guncelle"

          for attempt in 1 2 3 4 5; do
            echo "Push denemesi: $attempt/5"
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Raporlar basariyla depoya kaydedildi."
              exit 0
            fi

            echo "Depo bu sirada degisti; tekrar deneniyor."
            sleep $((attempt * 2))
          done

          echo "Raporlar 5 denemeden sonra depoya kaydedilemedi."
          exit 1
