name: MENAR Otomatik Yonetim Raporu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-ceo-report.yml'
      - 'automation/report.js'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: menar-automatic-report
  cancel-in-progress: true

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bitrix ve Meta raporunu uret
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
        run: node automation/report.js

      - name: Raporu depoya kaydet
        run: |
          git config user.name "menar-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "Otomatik yonetim raporunu guncelle"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
